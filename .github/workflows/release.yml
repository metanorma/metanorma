# Variant of `release_wo_bundle_install_manual_notes.yml` for Tier A gems
# wired to `riboseinc/provenance-release` (riboseinc/provenance#4).
#
# In addition to `release_notes: manual` and the `post_install` no-bundle-
# install setup, this template:
# - requests `attestations: write` and `pull-requests: write` permissions,
# - enables `upload_artifact: true` on `rubygems-release.yml` so the built
#   `.gem` package is staged and a GitHub Release is ensured even in
#   `release_notes: manual` mode, and
# - calls `riboseinc/provenance-release/.github/workflows/release.yml`
#   pinned by full 40-character commit SHA to generate CISA 2026-valid
#   SPDX 3.0 and CycloneDX 1.7 SBOMs, keyless SLSA Build Level 3
#   attestations, `NOTICE`, `lifecycle.json`, and the support-period footer.

name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch (or pre|rc|etc).
          Also, you can pass 'skip' to skip 'git tag' and do 'gem push' for the current version
        required: true
        default: 'skip'
      support_until:
        description: 'Declared support end date in YYYY-MM-DD format (defaults to 2 years from release date)'
        required: false
        default: ''
        type: string
  repository_dispatch:
    types: [ do-release ]
  # The publish leg: when the release PR (head branch release/v*) merges,
  # metanorma/ci tags the merge commit and publishes (metanorma/ci#515).
  # Ordinary PR closes are skipped inside the reusable workflow.
  pull_request:
    types:
      - closed

# Least-privilege ceiling for the called workflows:
# - rubygems-release.yml needs contents:write (git tag push), id-token:write
#   (OIDC Trusted Publishing), and pull-requests:write (release-PR leg, ci#515).
# - provenance-release needs contents:write (Release asset upload & notes),
#   id-token:write (Sigstore OIDC), and attestations:write (SLSA Build L3).
permissions:
  contents: write
  id-token: write
  pull-requests: write
  attestations: write

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
      bundler_cache: false
      post_install: gem install bundler rake rspec
      # Opt out of the auto-generated GitHub Release notes floor added in
      # metanorma/ci#354. Notes are written by hand at release time; the
      # workflow ensures an empty Release exists only when provenance upload
      # requires one, leaving existing Release notes untouched.
      release_notes: manual
      upload_artifact: true
      support_until: ${{ github.event.inputs.support_until }}
    secrets:
      rubygems-api-key: ${{ secrets.METANORMA_CI_RUBYGEMS_API_KEY }}
      pat_token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

  provenance:
    name: Generate and attest release provenance
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.published == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: riboseinc/provenance-release/.github/workflows/release.yml@f51a7eaf5fde52950d64ddbd531612e3f980ae20
    with:
      artifacts: release-artifacts
      artifact-name: ${{ needs.release.outputs.artifact_name }}
      release-tag: ${{ needs.release.outputs.release_tag }}
      support-until: ${{ needs.release.outputs.support_until }}
      author: "Ribose Inc."
      supplier: "Ribose Inc."
      attest: true
      upload-release: true
